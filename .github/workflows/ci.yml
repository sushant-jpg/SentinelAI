name: Verify SentinelAI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sentinelai
          POSTGRES_DB: sentinelai
          POSTGRES_PASSWORD: ci-only-ephemeral-database
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sentinelai"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r backend/requirements.lock
      - run: ruff check backend
      - run: pytest -q
        working-directory: backend
      - run: alembic upgrade head && alembic check
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://sentinelai:ci-only-ephemeral-database@localhost:5432/sentinelai
      - run: pip-audit -r backend/requirements.lock
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run build && npm audit --audit-level=high
        working-directory: frontend
